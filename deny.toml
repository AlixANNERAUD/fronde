[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Needs a database and -wal pair a less trusted party wrote; sqlx 0.9.0 caps libsqlite3-sys below 0.38.
  { id = "RUSTSEC-2026-0459", reason = "only processes running as the owner can write the 0700 data directory (files of another user are refused at open), and those can already read Fronde's data and keys; upgrade once sqlx-sqlite allows libsqlite3-sys 0.39" },
  { id = "RUSTSEC-2024-0384", reason = "instant (unmaintained) only reaches the components through wstd's futures-lite 1; no upgrade yet" },
  # zbus 6 merged its sub-crates in; the keychain's Secret Service client (secret-service 5.2,
  # through zbus-secret-service-keyring-store 1.0.1) is on zbus 5, and secret-service 6 is a
  # release candidate. Unmaintained only, no known flaw: drop these once a stable store uses zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant (merged into zbus 6) comes through secret-service 5.2 on zbus 5, the latest stable Secret Service client; no stable upgrade yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names (merged into zbus 6) comes through secret-service 5.2 on zbus 5; no stable upgrade yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive (merged into zbus 6) comes through secret-service 5.2 on zbus 5; no stable upgrade yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "ISC",
  "CDLA-Permissive-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "rustls only" },
  { name = "native-tls", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The calendar component uses the owner's calcard fork (components/calendar/Cargo.toml). The
# other projects checked against this file do not, so an unused allowance is no warning.
allow-git = ["https://github.com/AlixANNERAUD/calcard"]
unused-allowed-source = "allow"
