[tools]
node = "22.23.5"
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown,wasm32-wasip2", mr_boxington = true }
mr-boxington = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:tailwindlabs/tailwindcss" = "4.2.1"
# The Dioxus CLI builds the web interface. It downloads the tools it needs itself (wasm-bindgen
# matching Cargo.lock, wasm-opt, esbuild) into ~/.local/share/.dx, or $DX_HOME when set.
"github:DioxusLabs/dioxus" = "0.7.10"
# Builds the documentation in docs/ (mise run docs).
"github:rust-lang/mdBook" = { version = "0.5.4", bin = "mdbook" }

[env]
# The web interface has wasm-only dependencies and its own lint and test runs, so server-side
# commands leave it out.
FRONDE_SERVER_PACKAGES = "--workspace --exclude fronde-web"
DX_TELEMETRY_ENABLED = "false"
# Tool components: standalone Cargo projects (own lock file and release profile), built for
# wasm32-wasip2 against the guest SDK, which stands alone too.
FRONDE_COMPONENTS = "components/echo components/calendar"
FRONDE_COMPONENT_SDK = "crates/component-sdk"
# The Claude ACP adapter installed by `mise run agent` (agent/package-lock.json).
_.path = ["{{config_root}}/agent/node_modules/.bin"]

[tasks.agent]
description = "Install the Claude ACP adapter from agent/package-lock.json into agent/node_modules"
run = "npm ci --prefix agent --omit=dev"

[tasks.format]
description = "Format the code"
run = [
  "cargo fmt --all",
  "for p in $FRONDE_COMPONENT_SDK $FRONDE_COMPONENTS; do cargo fmt --manifest-path $p/Cargo.toml --all; done",
]

[tasks.lint]
description = "Check formatting and run clippy on the server, web and component code"
depends = ["web-css"]
run = [
  "cargo fmt --all --check",
  "cargo clippy $FRONDE_SERVER_PACKAGES --all-targets -- -D warnings",
  "cargo clippy --package fronde-web --all-targets -- -D warnings",
  "cargo clippy --package fronde-web --target wasm32-unknown-unknown -- -D warnings",
  # The SDK carries a copy of the frozen WIT it targets.
  "diff -r wit/v0.1 $FRONDE_COMPONENT_SDK/wit",
  "cargo fmt --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all --check",
  "cargo clippy --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all-targets --all-features -- -D warnings",
  "cargo clippy --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --target wasm32-wasip2 -- -D warnings",
  "set -e; for p in $FRONDE_COMPONENTS; do cargo fmt --manifest-path $p/Cargo.toml --all --check; cargo clippy --manifest-path $p/Cargo.toml --target wasm32-wasip2 -- -D warnings; done",
  # The calendar's logic and tests also build on the host.
  "cargo clippy --manifest-path components/calendar/Cargo.toml --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the test suite"
depends = ["web-css", "components"]
run = [
  "cargo nextest run $FRONDE_SERVER_PACKAGES --no-tests=pass",
  "cargo nextest run --package fronde-web",
  "cargo nextest run --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all-features",
  "cargo test --doc --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml",
  # The calendar's logic is tested on the host; its export glue only builds for wasm32.
  "cargo nextest run --manifest-path components/calendar/Cargo.toml",
]

# The web crate embeds its stylesheet at compile time, so Cargo needs the file. It is built with
# the Tailwind pinned above for every use; dx would run its own Tailwind on `crates/web/tailwind.css`
# and ignore its errors, hence the input under `style/`.
[tasks.web-css]
description = "Generate the web interface's stylesheet"
hide = true
run = "tailwindcss --input crates/web/style/tailwind.css --output crates/web/assets/tailwind.css"

# Each tool component is built for WASI in its own project. The .wasm files are copied to
# components/dist, where fronde-wasm's tests load them (mr-boxington prunes idle target
# directories), each with its manifest beside it under the same name (calendar.toml), where
# Fronde looks for it.
[tasks.components]
description = "Build the tool components for wasm32-wasip2 into components/dist"
run = [
  "mkdir -p components/dist",
  "set -e; for p in $FRONDE_COMPONENTS; do cargo build --manifest-path $p/Cargo.toml --target wasm32-wasip2 --release; for w in $p/target/wasm32-wasip2/release/*.wasm; do cp $w components/dist/; cp $p/fronde-component.toml components/dist/$(basename $w .wasm).toml; done; done",
]

# The SDK and the components use the root deny.toml, which cargo-deny finds from their directories
# upwards. Passing `--config deny.toml` instead breaks under mr-boxington, which reads it as
# Cargo's own `--config`.
[tasks.deny]
description = "Check advisories, licences, bans and sources, components included"
run = [
  "cargo deny check",
  "set -e; for p in $FRONDE_COMPONENT_SDK $FRONDE_COMPONENTS; do cargo deny --manifest-path $p/Cargo.toml check; done",
]

[tasks.check]
description = "Everything CI checks, except the release build"
depends = ["lint", "test", "deny"]

# Writes a development configuration under target/dev at each run, so it follows this file: a
# random token and the password `fronde`, both made once, and a data directory of its own.
# `listen` is where `web-dev` sends /ws and the sign-in forms (crates/web/Dioxus.toml).
[tasks.dev]
description = "Run the server on http://127.0.0.1:8484 for `mise run web-dev` (password: fronde)"
run = '''
set -eu
dev=target/dev
mkdir -p "$dev/data"
[ -f "$dev/token" ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$dev/token"
[ -f "$dev/password" ] || printf fronde > "$dev/password"
cat > "$dev/fronde.toml" <<EOF
[server]
listen = "127.0.0.1:8484"
token = { file = "$PWD/$dev/token" }

[data]
dir = "$PWD/$dev/data"
timezone = "Europe/Paris"

[memory]
git = false

[web]
password = { file = "$PWD/$dev/password" }
EOF
cargo run --package fronde -- serve --config "$dev/fronde.toml"
'''

# The binary carries the hashes of the components in components/dist (crates/wasm/build.rs), which
# it approves without hashes in their entry: they are built first.
[tasks.build]
description = "Build the components, the web interface and the release binary"
depends = ["web-build", "components"]
run = "cargo build --release --package fronde"

# dx leaves the assets of earlier builds in place; the output starts empty so that only the
# current ones are served and copied into the image.
[tasks.web-build]
description = "Build the web interface into target/dx/fronde-web/release/web/public"
depends = ["web-css"]
run = [
  "rm -rf target/dx/fronde-web/release/web/public",
  "dx build --package fronde-web --platform web --release",
]

# Tailwind rebuilds the stylesheet as classes change; dx reloads it in the page.
[tasks.web-dev]
description = "Serve the web interface with hot reload; `mise run dev` answers /ws and the sign-in forms"
depends = ["web-css"]
run = '''
tailwindcss --input crates/web/style/tailwind.css --output crates/web/assets/tailwind.css --watch=always &
trap 'kill $!' EXIT
dx serve --package fronde-web --platform web
'''

[tasks.docs]
description = "Build the documentation into docs/book"
run = "mdbook build docs"
