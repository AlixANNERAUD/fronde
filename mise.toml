[tools]
node = "22.23.5"
rust = { version = "1.100.0", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown,wasm32-wasip2", mr_boxington = true }
mr-boxington = "latest"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:tailwindlabs/tailwindcss" = "4.2.1"
# The Dioxus CLI builds the web interface. It downloads the tools it needs itself (wasm-bindgen
# matching Cargo.lock, wasm-opt, esbuild) into ~/.local/share/.dx, or $DX_HOME when set.
"github:DioxusLabs/dioxus" = "0.7.10"
# Generates the entities from the migrated schema (mise run entities).
"github:SeaQL/sea-orm" = { version = "2.0.4", version_prefix = "sea-orm-cli@", bin = "sea-orm-cli" }
# Builds the documentation in docs/ (mise run docs).
"github:rust-lang/mdBook" = { version = "0.5.4", bin = "mdbook" }
# Byte-compiles the Python standard library at build time (mise run python); the binary embeds
# the wasmtime crate instead.
wasmtime = "50.0.1"

[env]
# The web interface has wasm-only dependencies and its own lint and test runs, so server-side
# commands leave it out.
FRONDE_SERVER_PACKAGES = "--workspace --exclude fronde-web"
DX_TELEMETRY_ENABLED = "false"
# Tool components: standalone Cargo projects (own lock file and release profile), built for
# wasm32-wasip2 against the guest SDK, which stands alone too.
FRONDE_COMPONENTS = "components/echo components/calendar"
FRONDE_COMPONENT_SDK = "crates/component-sdk"
# The Claude ACP adapter installed by `mise run agent` (agent/package-lock.json).
_.path = ["{{config_root}}/agent/node_modules/.bin"]

[tasks.agent]
description = "Install the Claude ACP adapter from agent/package-lock.json into agent/node_modules"
run = "npm ci --prefix agent --omit=dev"

[tasks.format]
description = "Format the code"
run = [
  "cargo fmt --all",
  "for p in $FRONDE_COMPONENT_SDK $FRONDE_COMPONENTS; do cargo fmt --manifest-path $p/Cargo.toml --all; done",
]

[tasks.lint]
description = "Check formatting and run clippy on the server, web and component code"
depends = ["web-css"]
run = [
  "cargo fmt --all --check",
  "cargo clippy $FRONDE_SERVER_PACKAGES --all-targets -- -D warnings",
  "cargo clippy --package fronde-web --all-targets -- -D warnings",
  "cargo clippy --package fronde-web --target wasm32-unknown-unknown -- -D warnings",
  # The SDK carries a copy of the frozen WIT it targets.
  "diff -r wit/v0.1 $FRONDE_COMPONENT_SDK/wit",
  "cargo fmt --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all --check",
  "cargo clippy --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all-targets --all-features -- -D warnings",
  "cargo clippy --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --target wasm32-wasip2 -- -D warnings",
  "set -e; for p in $FRONDE_COMPONENTS; do cargo fmt --manifest-path $p/Cargo.toml --all --check; cargo clippy --manifest-path $p/Cargo.toml --target wasm32-wasip2 -- -D warnings; done",
  # The calendar's logic and tests also build on the host.
  "cargo clippy --manifest-path components/calendar/Cargo.toml --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the test suite"
depends = ["web-css", "components", "python"]
run = [
  "cargo nextest run $FRONDE_SERVER_PACKAGES --no-tests=pass",
  "cargo nextest run --package fronde-web",
  "cargo nextest run --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml --all-features",
  "cargo test --doc --manifest-path $FRONDE_COMPONENT_SDK/Cargo.toml",
  # The calendar's logic is tested on the host; its export glue only builds for wasm32.
  "cargo nextest run --manifest-path components/calendar/Cargo.toml",
]

# The web crate embeds its stylesheet at compile time, so Cargo needs the file. It is built with
# the Tailwind pinned above for every use; dx would run its own Tailwind on `crates/web/tailwind.css`
# and ignore its errors, hence the input under `style/`.
[tasks.web-css]
description = "Generate the web interface's stylesheet"
hide = true
run = "tailwindcss --input crates/web/style/tailwind.css --output crates/web/assets/tailwind.css"

# Each tool component is built for WASI in its own project. Its .wasm is named after its
# directory and copied to a fresh components/dist (the cached target directory may hold stale
# files, which are left behind). The tests of fronde-wasm load the components from there. Each
# one's manifest goes beside it under the same name (calendar.toml), where Fronde looks for it.
# mr-boxington prunes idle target directories, hence the copy.
[tasks.components]
description = "Build the tool components for wasm32-wasip2 into components/dist"
run = [
  "rm -rf components/dist && mkdir -p components/dist",
  "set -e; for p in $FRONDE_COMPONENTS; do cargo build --manifest-path $p/Cargo.toml --target wasm32-wasip2 --release; n=$(basename $p | tr - _); cp $p/target/wasm32-wasip2/release/$n.wasm components/dist/; cp $p/fronde-component.toml components/dist/$n.toml; done",
]

# CPython for WASI (wasm32-wasip1), built by CPython's WASI maintainer from the release tag with
# CPython's own Platforms/WASI script, plus the time zone database, which the build lacks. Both
# archives and the interpreter are checked against pinned hashes; PYTHON_WASM_SHA256 in
# crates/wasm/src/python.rs pins the same python.wasm, and Fronde refuses any other. The standard
# library is byte-compiled once here, with unchecked hashes, so that each run skips compiling the
# modules it imports and the files' mtimes in the image do not matter. -j 0 would need
# multiprocessing, which WASI lacks. A stamp records the recipe, the archives and the interpreter
# installed: the task does nothing when they are already there and python.wasm still matches; bump
# `recipe` when the steps change. A lock beside python/ keeps two runs (`check` runs `test` and
# `lint` side by side) from replacing it at once. Upgrading Python: docs/src/how-to/develop.md.
[tasks.python]
description = "Fetch the pinned CPython WASI build into python/"
run = '''
set -eu
python_url=https://github.com/brettcannon/cpython-wasi-build/releases/download/v3.15.2/python-3.15.2-wasi_sdk-33.zip
python_sha256=b8a63559c56760bbdc310dedb74fd69d10bcbafae26b705bea0ad353ad256888
tzdata_url=https://files.pythonhosted.org/packages/0a/66/9a06c2227fedfd4919f0eaaa8b94377d9730882a7e4f95823c9a331ab5e1/tzdata-2026.6-py2.py3-none-any.whl
tzdata_sha256=0a10eec6e13ef16b627fabed9a5f2ba61a62b1c67f327305f4e7e412a70b4aec
# The same as PYTHON_WASM_SHA256 in crates/wasm/src/python.rs.
wasm_sha256=dd076791fb6d1286a5dfe105852dfb3367e10562de68ca0a618e615625cdf636
recipe=2
stamp="recipe=$recipe python=$python_sha256 tzdata=$tzdata_sha256 wasm=$wasm_sha256"
exec 9> python.lock
flock 9
if [ -f python/.installed ] && [ "$(cat python/.installed)" = "$stamp" ] \
  && echo "$wasm_sha256  python/python.wasm" | sha256sum --check --strict --quiet 2>/dev/null; then
  exit 0
fi
rm -rf python
mkdir -p python/.work
curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o python/.work/python.zip "$python_url"
curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o python/.work/tzdata.whl "$tzdata_url"
echo "$python_sha256  python/.work/python.zip" | sha256sum --check --strict --quiet
echo "$tzdata_sha256  python/.work/tzdata.whl" | sha256sum --check --strict --quiet
unzip -q python/.work/python.zip -d python
unzip -q python/.work/tzdata.whl 'tzdata/*' -d python/lib/python3.15/site-packages
unzip -q -j python/.work/tzdata.whl 'tzdata-*.dist-info/licenses/LICENSE' -d python/.work
mv python/.work/LICENSE python/LICENSE.tzdata
rm -rf python/.work
echo "$wasm_sha256  python/python.wasm" | sha256sum --check --strict --quiet
wasmtime run --dir python/lib::/lib python/python.wasm -I -m compileall -q --invalidation-mode unchecked-hash /lib/python3.15
echo "$stamp" > python/.installed
'''

# The SDK and the components use the root deny.toml, which cargo-deny finds from their directories
# upwards. Passing `--config deny.toml` instead breaks under mr-boxington, which reads it as
# Cargo's own `--config`.
[tasks.deny]
description = "Check advisories, licences, bans and sources, components included"
run = [
  "cargo deny check",
  "set -e; for p in $FRONDE_COMPONENT_SDK $FRONDE_COMPONENTS; do cargo deny --manifest-path $p/Cargo.toml check; done",
]

[tasks.check]
description = "Everything CI checks, except the release build"
depends = ["lint", "test", "deny"]

# Writes a development configuration under target/dev at each run, so it follows this file: a
# random token and the password `fronde`, both made once, and a data directory of its own.
# `listen` is where `web-dev` sends /ws and the sign-in forms (crates/web/Dioxus.toml).
[tasks.dev]
description = "Run the server on http://127.0.0.1:8484 for `mise run web-dev` (password: fronde)"
depends = ["python"]
run = '''
set -eu
dev=target/dev
mkdir -p "$dev/data"
[ -f "$dev/token" ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$dev/token"
[ -f "$dev/password" ] || printf fronde > "$dev/password"
cat > "$dev/fronde.toml" <<EOF
[server]
listen = "127.0.0.1:8484"
token = { file = "$PWD/$dev/token" }

[data]
dir = "$PWD/$dev/data"
timezone = "Europe/Paris"

[memory]
git = false

[web]
password = { file = "$PWD/$dev/password" }

[python]
dir = "$PWD/python"
EOF
cargo run --package fronde -- serve --config "$dev/fronde.toml"
'''

# The binary carries the hashes of the components in components/dist (crates/wasm/build.rs), which
# it approves without hashes in their entry: they are built first. One cargo build at a time, so
# that a small machine does not run out of memory. The Python runtime ships beside the binary.
[tasks.build]
description = "Build the components, the web interface and the release binary, and fetch Python"
depends = ["web-build"]
run = ["mise run components", "mise run python", "cargo build --release --package fronde"]

# dx leaves the assets of earlier builds in place; the output starts empty so that only the
# current ones are served and copied into the image.
[tasks.web-build]
description = "Build the web interface into target/dx/fronde-web/release/web/public"
depends = ["web-css"]
run = [
  "rm -rf target/dx/fronde-web/release/web/public",
  "dx build --package fronde-web --platform web --release",
]

# Tailwind rebuilds the stylesheet as classes change; dx reloads it in the page.
[tasks.web-dev]
description = "Serve the web interface with hot reload; `mise run dev` answers /ws and the sign-in forms"
depends = ["web-css"]
run = '''
tailwindcss --input crates/web/style/tailwind.css --output crates/web/assets/tailwind.css --watch=always &
trap 'kill $!' EXIT
dx serve --package fronde-web --platform web
'''

# The throwaway database and the generated files live under target/ rather than the system
# temporary directory, and the committed entities are only replaced once generation succeeded.
# The example applies the migrations without building the server. FTS5 tables (virtual and
# shadow) and the session store's table are not entities.
[tasks.entities]
description = "Regenerate the SeaORM entities from the migrations"
run = '''
set -eu
directory=target/entities-schema
rm -rf "$directory"
mkdir -p "$directory"
cargo run --quiet --package fronde-migration --example migrate -- "sqlite://$PWD/$directory/schema.db?mode=rwc"
sea-orm-cli generate entity --database-url "sqlite://$PWD/$directory/schema.db" --output-dir "$directory/entities" --with-serde both --date-time-crate chrono --banner-version off --ignore-tables seaql_migrations,tower_sessions,memory_fts,memory_fts_data,memory_fts_idx,memory_fts_content,memory_fts_docsize,memory_fts_config
rm -rf crates/entity/src/entities
mv "$directory/entities" crates/entity/src/entities
rm -rf "$directory"
cargo fmt --package fronde-entity
'''

[tasks.docs]
description = "Build the documentation into docs/book"
run = "mdbook build docs"
