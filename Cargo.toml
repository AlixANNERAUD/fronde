[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"
rust-version = "1.100"

[workspace.dependencies]
agent-client-protocol = { version = "5.3", features = ["process"] }
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
console_error_panic_hook = "0.1"
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-html = "0.7.10"
dioxus-ssr = "0.7.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
icalendar = "0.17"
leptos = { version = "0.8.23", features = ["islands"] }
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
reqwest = "0.13"
roxmltree = "0.21"
rmcp = { version = "=3.10.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1.1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core", "memory-store"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tw_merge = "0.1"
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies without debug information keep test binaries small and quick to link.
[profile.dev.package."*"]
debug = false

# Leptos views are nested generic types; their full debug information makes linking the test
# binaries need gigabytes. Line tables keep backtraces readable.
[profile.dev.package.jarvis-app]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
strip = true

# dx builds the web interface with this profile too. Stripping would remove the custom sections
# wasm-bindgen reads; wasm-bindgen and wasm-opt shrink the output afterwards anyway.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = false

[[workspace.metadata.leptos]]
name = "jarvis"
bin-package = "jarvis"
lib-package = "jarvis-frontend"
output-name = "jarvis"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/main.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
lib-profile-release = "wasm-release"
