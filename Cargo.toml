[workspace]
resolver = "3"
members = ["crates/*"]
# The guest SDK stands alone, as the components that depend on it do.
exclude = ["crates/component-sdk"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"
rust-version = "1.100"

[workspace.dependencies]
agent-client-protocol = { version = "5.3", features = ["process"] }
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
# The supervisor's backoff only: no sleeper, no blocking support.
backon = { version = "1.6", default-features = false, features = ["std"] }
base64 = "0.22"
bytes = "1"
# Stored secrets (crates/db): XChaCha20-Poly1305, its key state zeroed on drop.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-html = "0.7.10"
dioxus-ssr = "0.7.10"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
etcetera = "0.11"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
http = "1"
# Durations in the configuration, such as `[threads] idle_stop = "10m"` (already in the tree).
jiff = "0.2"
http-body = "1"
getrandom = "0.4"
http-body-util = "0.1"
# The component gate's HTTP client (crates/wasm/src/dial.rs): the crates wasmtime-wasi-http uses.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iana-time-zone = "0.1"
# The agent's sandbox (crates/agent/src/confine.rs), Linux only.
landlock = "0.4.7"
# The agent's seccomp filter (crates/agent/src/confine.rs), Linux only: no Unix sockets.
seccompiler = "0.5.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
reqwest = "0.13"
# Patterns of component settings (a manifest's JSON Schema).
regex = "1"
rmcp = { version = "=3.10.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
schemars = "1.1"
# The database (crates/db). SQLite needs no TLS, hence plain `runtime-tokio`.
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-chrono", "with-json"] }
# Without the default `cli` feature, which pulls clap, dotenvy and sea-orm-cli.
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
secrecy = "0.10"
semver = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
# Web sessions in fronde.db, on SeaORM's sqlx pool (one sqlx in the tree).
tower-sessions-sqlx-store = { version = "0.16", default-features = false, features = ["sqlite"] }
toml = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Which characters a card never shows as they are (format, unassigned, private use…).
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
# A confusable skeleton (UTS #39) and NFKC, to read a form field's name as a person would.
unicode-security = "0.1"
unicode-normalization = "0.1"
tw_merge = "0.1"
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
# The browser's clock and time zone, for a date and time typed in a card.
js-sys = "0.3"
webpki-roots = "1"
zeroize = "1"
web-sys = "0.3"
# Only what a host of tool components uses: no GC, threads, cache or debugging support.
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "parallel-compilation", "runtime", "std", "wat"] }
# p1 runs CPython for WASI (crates/wasm/src/python.rs), a wasm32-wasip1 core module.
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p1", "p2"] }
# Without its default sender: the gate sends requests itself (crates/wasm/src/dial.rs).
wasmtime-wasi-http = { version = "50.0.1", default-features = false, features = ["p2"] }
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies without debug information keep test binaries small and quick to link.
[profile.dev.package."*"]
debug = false

# Unoptimised, Cranelift takes about 10 s to compile CPython for WASI in each test that loads it.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true

# `dx build --release --platform web` builds with this profile; without it dx would make one up
# with `opt-level = "s"`. Stripping would remove the custom sections wasm-bindgen reads, and dx
# does not turn it off for a profile defined here; wasm-opt shrinks the output afterwards anyway.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = false

