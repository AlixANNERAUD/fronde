[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
icalendar = "0.17"
reqwest = "0.13"
roxmltree = "0.21"
rmcp = { version = "=3.10.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest", "transport-child-process"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1.1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
subtle = "2"
tempfile = "3"
tokio = { version = "1.54", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
url = { version = "2", features = ["serde"] }
