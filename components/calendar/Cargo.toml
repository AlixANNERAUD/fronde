# A standalone project: it depends on the guest SDK only and has its own lock file.
[workspace]

[package]
name = "fronde-calendar"
description = "Calendar and reminder tools over CalDAV, as a tool component"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Named after what it brings, so that the build makes calendar.wasm. The rlib lets the logic be
# tested on the host.
[lib]
name = "calendar"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
fronde-component = { path = "../../crates/component-sdk" }
http = "1"
calcard = { version = "0.3", default-features = false }
roxmltree = "0.21"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
calcard = { version = "0.3", default-features = false, features = ["wasm"] }

[dev-dependencies]
fronde-component = { path = "../../crates/component-sdk", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
