# A standalone project: it depends on the guest SDK only and has its own lock file.
[workspace]

[package]
name = "fronde-calendar"
description = "Calendar and reminder tools over CalDAV, as a tool component"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Named after what it brings, so that the build makes calendar.wasm. The rlib lets the logic be
# tested on the host.
[lib]
name = "calendar"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
fronde-component = { version = "0.1", path = "../../crates/component-sdk" }
http = "1"
# The owner's fork of calcard (https://github.com/AlixANNERAUD/calcard), until its fixes are
# upstream: 0.3.14 escapes URI values, decodes inline base64 and drops ENCODING, and loses data:
# URIs it cannot rebuild, so an edit could change data Fronde does not model. The fork keeps them
# as read (its README and CHANGELOG list each change) and keeps calcard's licence, MIT or
# Apache-2.0.
calcard = { git = "https://github.com/AlixANNERAUD/calcard", tag = "v0.3.16-fronde.1", default-features = false }
roxmltree = "0.21"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

# calcard's `wasm` feature turns on hashify's `force-32bit`. hashify is a proc macro: it runs on the
# 64-bit build machine and picks its hashing by the machine's pointer width, not the target's. Its
# 64-bit tables index with `hash as usize`, which truncates on wasm32 and finds the wrong slot, so
# calcard would not recognise property names. Host builds (tests) keep the 64-bit default.
[target.'cfg(target_arch = "wasm32")'.dependencies]
calcard = { git = "https://github.com/AlixANNERAUD/calcard", tag = "v0.3.16-fronde.1", default-features = false, features = ["wasm"] }

[dev-dependencies]
fronde-component = { version = "0.1", path = "../../crates/component-sdk", features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
