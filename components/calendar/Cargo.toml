[package]
name = "fronde-calendar"
description = "Calendar and reminder tools over CalDAV, as a tool component"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

# Named after what it brings, so that the build makes calendar.wasm. The rlib lets the logic
# modules be tested on the host; only the WIT glue is wasm-only.
[lib]
name = "calendar"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
http.workspace = true
icalendar.workspace = true
roxmltree.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true
wstd.workspace = true

[lints]
workspace = true
