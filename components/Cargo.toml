# Tool components, built for wasm32-wasip2 by `mise run components` and loaded by `fronde-wasm`.
# A workspace of their own: the guest bindings need `unsafe` (see each crate's `bindings` module),
# and their dependencies stay out of the server's lock file, lints and test runs.
[workspace]
resolver = "3"
members = ["calendar", "echo"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
http = "1"
icalendar = "0.17"
roxmltree = "0.21"
schemars = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wit-bindgen = "0.63"
wstd = "0.6.8"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
