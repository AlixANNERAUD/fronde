[package]
name = "jarvis-app"
description = "Web chat of jarvis."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
jarvis-protocol = { path = "../protocol" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde_json.workspace = true
# The chat island's WebSocket, reconnection timer and page visibility.
web-sys = { workspace = true, optional = true, features = [
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "Location",
    "MessageEvent",
    "VisibilityState",
    "WebSocket",
    "Window",
] }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:web-sys", "dep:wasm-bindgen"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[lints]
workspace = true
