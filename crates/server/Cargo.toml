[package]
name = "fronde"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono-tz.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
fronde-agent = { path = "../agent" }
fronde-db = { path = "../db" }
fronde-hub = { path = "../hub" }
fronde-protocol = { path = "../protocol" }
fronde-requests = { path = "../requests" }
fronde-wasm = { path = "../wasm" }
getrandom.workspace = true
iana-time-zone.workspace = true
reqwest.workspace = true
rmcp.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tower-sessions.workspace = true
tower-sessions-sqlx-store.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# `serve` makes itself non-dumpable and sets RLIMIT_CORE to 0 (hardening.rs).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
base64.workspace = true
futures.workspace = true
# The `expose_secret_call_sites` architecture test parses the sources.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full"] }
tracing-log = "0.2"
fronde-agent = { path = "../agent", features = ["testing"] }
fronde-db = { path = "../db", features = ["testing"] }
fronde-entity = { path = "../entity" }
fronde-hub = { path = "../hub", features = ["testing"] }
# An older schema for `fronde check`'s tests.
fronde-migration = { path = "../migration" }
sea-orm.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
# The log canary's page: a WebSocket client that logs nothing, so that a secret it sends can reach
# the captured log only from the server's side.
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "ring", "getrandom"] }
tempfile.workspace = true
wiremock.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The confinement tests' probe opens sockets of every family.
rustix = { version = "1", features = ["net", "process"] }

[lints]
workspace = true
