# The guest SDK: what a tool component depends on. It stands alone (no workspace, no other Fronde
# crate) so that it can be published and components can live in their own repositories.
# Its own workspace: not part of Fronde's.
[workspace]

[package]
name = "fronde-component"
description = "Write tool components for Fronde: the fronde:component WIT, export glue, settings and HTTP"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/AlixANNERAUD/fronde"
keywords = ["fronde", "wasm", "component", "wasi"]
categories = ["wasm"]
# The WIT it targets ships inside the crate: a copy of the frozen wit/v0.1 at the repository root.
include = ["src/**", "wit/**", "Cargo.toml"]

[features]
# An in-memory HTTP server and a future runner, for testing components natively.
testing = []

[dependencies]
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"
wstd = "0.6.8"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
