[package]
name = "fronde-hub"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Test hooks: a fake keychain and a credentials directory in `SecretsConfig`; only
# dev-dependencies turn it on.
testing = []

[dependencies]
anyhow.workspace = true
fronde-db = { path = "../db" }
fronde-fs = { path = "../fs" }
fronde-protocol = { path = "../protocol" }
fronde-requests = { path = "../requests" }
async-trait.workspace = true
backon.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
http.workspace = true
rmcp.workspace = true
schemars.workspace = true
sea-orm.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
etcetera.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# In-process servers that ask Fronde to fill a form.
rmcp = { workspace = true, features = ["elicitation"] }
fronde-db = { path = "../db", features = ["testing"] }
axum.workspace = true
tempfile.workspace = true

[lints]
workspace = true
