[package]
name = "fronde-agent"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The fake ACP agent used by tests here and in dependent crates, in process or on stdio.
testing = ["tokio-util/compat"]

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
getrandom.workspace = true
sea-orm.workspace = true
fronde-db = { path = "../db" }
fronde-entity = { path = "../entity" }
fronde-fs = { path = "../fs" }
fronde-protocol = { path = "../protocol" }
fronde-requests = { path = "../requests" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The `__confine` helper: the agent's sandbox and its priority.
landlock.workspace = true
libc = "0.2"
seccompiler.workspace = true
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
fronde-agent = { path = ".", features = ["testing"] }

[lints]
workspace = true
