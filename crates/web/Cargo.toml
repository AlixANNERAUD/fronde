[package]
name = "fronde-web"
description = "Web interface of fronde, built with Dioxus."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# A date and time a form suggests, shown in the page's own time.
chrono.workspace = true
dioxus.workspace = true
fronde-client = { path = "../client" }
fronde-protocol = { path = "../protocol" }
serde_json.workspace = true
strum.workspace = true
tw_merge.workspace = true

# The WebSocket, its retry timer and the page's visibility exist only in the browser; natively
# the page compiles without them so its components are tested with dioxus-ssr.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "VisibilityState", "Window"] }

[dev-dependencies]
# Events built from plain data, to send key presses natively in tests.
dioxus-html.workspace = true
dioxus-ssr.workspace = true

[features]
default = []
# dx enables it for `--platform web`.
web = ["dioxus/web"]

[lints]
workspace = true
