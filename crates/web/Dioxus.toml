[application]
name = "fronde-web"

[web]
# Writes .br copies of the release files next to them, for the server to send.
pre_compress = true

[web.app]
title = "Fronde"

# `dx serve` serves the interface, the sign-in page included; a Fronde server on 127.0.0.1:8484
# answers the chat's socket and the sign-in and sign-out forms. A proxy takes every method of a
# path, hence forms posted under `/auth` rather than to the pages' own paths.
[[web.proxy]]
backend = "http://127.0.0.1:8484/ws"

[[web.proxy]]
backend = "http://127.0.0.1:8484/auth"
