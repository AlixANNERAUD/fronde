[package]
name = "fronde-db"
description = "Fronde's SQLite database: opening, migrations, transactions, the key-value table and the stored secrets."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
fronde-entity = { path = "../entity" }
fronde-fs = { path = "../fs" }
fronde-migration = { path = "../migration" }
getrandom.workspace = true
percent-encoding = "2"
sea-orm.workspace = true
secrecy.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# The master key file must belong to the user running Fronde.
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
