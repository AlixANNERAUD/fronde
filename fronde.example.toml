# Full reference configuration, oriented to Docker and infrastructure-as-code: /data for the data
# directory and /run/secrets/… for secrets. For a native install, run `fronde init` instead: it
# writes a minimal configuration with per-user defaults.
# Secrets are never written here: use { file = "…" } or { env = "…" }.

[server]
# Use "0.0.0.0:8484" inside a container.
listen = "127.0.0.1:8484"
# Bearer token required on /mcp (at least 32 characters).
token = { file = "/run/secrets/fronde_token" }

[data]
dir = "/data"
timezone = "Europe/Paris"
user = "alix"

# Optional: caps for the core memory, in characters.
[memory]
memory_limit = 4000
user_limit = 2000
git = true

# Optional: where the master key of stored secrets (`fronde secret`) is kept. backend is "auto"
# (a systemd credential, else the keychain, else a file, then always that one), "systemd",
# "keychain" or "file". The file is apart from the data directory so that its backups do not hold
# it: left out, master.key beside this file; in a container, whose /config is read-only, a
# writable directory of its own (see Run in Docker).
[secrets]
backend = "file"
master_key = { file = "/keys/master.key" }

# Optional: code_run_python, which runs short Python for exact arithmetic, dates and aggregates,
# in a sandbox with the standard library only, no files and no network. dir holds the CPython
# for WASI that `mise run python` fetches; the image ships it here. Without it, no tool.
[python]
dir = "/app/python"

# Where tools come from besides Fronde's own (memory, tool search), 0..n, each with a unique name.

# A tool component: a .wasm file run in a sandbox, with its manifest beside it (calendar.toml)
# saying what it asks for. It reaches only the origins in allow, each one its manifest asks for,
# and never sees its credentials: Fronde adds them to its requests. The calendar shipped with
# Fronde is approved as it is: `fronde check` says "approved: shipped with this build". Any other
# component needs the two hashes `fronde check` prints, copied here once you have read its
# manifest; they pin it, and a component whose files change is not loaded until you approve the
# new ones the same way.
[[sources]]
kind = "component"
name = "calendar"
path = "/app/components/calendar.wasm"
# Only for a component not shipped with Fronde, or to pin this one:
# sha256 = "…"
# manifest_sha256 = "…"
# A server on this machine or the local network needs { origin = "http://…", local = true }, and
# https unless it is this machine (in Docker, the container).
allow = ["https://cloud.example"]

# Fronde adds timezone from [data].
[sources.settings]
events_url = "https://cloud.example/remote.php/dav/calendars/alix/personal/"
reminders_url = "https://cloud.example/remote.php/dav/calendars/alix/tasks/"

[[sources.credentials]]
origin = "https://cloud.example"
basic = { username = "alix", password = { env = "FRONDE_CALDAV_PASSWORD" } }

# An upstream MCP server: exactly one of url or command. Its tools are named mcphub_….
[[sources]]
kind = "mcp"
name = "mcphub"
url = "https://mcphub.example/mcp"
token = { env = "MCPHUB_TOKEN" }

# Optional: the chat with Fronde at /, behind a password. Without it the server is only the hub.
# Behind a reverse proxy, forward the Host header: the chat's WebSocket checks Origin against it.
[web]
password = { file = "/run/secrets/fronde_password" }
# Set to true when the page is served over https.
secure_cookie = false

# Optional: the agent Fronde runs (ACP over stdio), started on the first message. It keeps only a
# few variables of Fronde's environment.
[agent]
command = ["claude-agent-acp"]
# Its Claude sign-in: the token `claude setup-token` prints, run in your own home. A secret like
# the others: { file = "…" }, { env = "…" } or { stored = "…" } (stored for
# https://api.anthropic.com). Never run `claude` with HOME set to the agent's home.
# oauth_token = { file = "claude-token" }
# Extra environment for the agent, in plain text: no secrets. For example, to run the installed
# Claude Code instead of the adapter's own:
# env = { CLAUDE_CODE_EXECUTABLE = "/home/alix/.local/bin/claude" }
env = {}
# Claude Code's own tools Fronde may use besides the hub's. Only the web ones are allowed; [] for
# none.
builtin_tools = ["WebSearch", "WebFetch"]
# Confine the agent with Landlock: it reads only system directories, its PATH, the adapter and
# `read`, and writes only <data>/agent and <data>/home. false runs it unconfined, with a warning.
sandbox = true
read = []

# Each agent's systemd scope, when a systemd user manager answers: memory (MemoryMax), CPUs
# (CPUQuota) and processes and threads (TasksMax); and the memory of all of them together, the
# MemoryMax of fronde-agents.slice. "none" leaves one out. Without systemd, as in a container,
# give the container its own limits.
[agent.limits]
memory = "2G"
total_memory = "4G"
cpus = 2
tasks = 512

# Each conversation (thread) has its own agent process. At most max_running run at once, one of
# them kept for the threads you start; an agent idle for idle_stop stops, and resumes its session
# on the next message.
[threads]
max_running = 3
idle_stop = "10m"
# Sub-agents: what an agent may start in the background, on your subscription's quota.
max_depth = 1
children_running = 3
# The share of each subscription window (5 hours, weekly) kept for you: past 100% minus this,
# no sub-agent starts or gets a message, and their results wait for your next message.
# "0%" turns it off.
reserve = "30%"
# Only when no usage reading decides (none yet, or reserve = "0%"): sub-agents started in
# 24 hours, all threads together.
children_per_day = 30
children_kept = 200
# Likewise only without a usage reading: turns of sub-agents threads start in 24 hours, each
# threads_start and threads_send.
child_turns_per_day = 100
# Also caps a turn that a sub-agent's result woke.
child_turn_timeout = "30m"
# Turns a thread may be woken by sub-agents' results in a row without a message from you;
# later results wait for your next message.
wakes_without_owner = 10
